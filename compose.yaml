# docker compose up --build          → shop on http://localhost:5080
# docker compose run --rm test       → unit, integration and architecture tests (Debug build, as the rules require)
# docker compose run --rm dotnet <args>  → any other dotnet command with a cached package store
#
# The DomainCentric.* packages come from NuGet.org. The tools service mounts the parent directory so
# `docker compose run --rm dotnet test -p:UseLocalDcaDotnet=true` can reference the sibling ../dca-dotnet.
services:
  shop-dotnet:
    build: .
    image: dca-shop-dotnet
    ports:
      - "5080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development

  dotnet:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    profiles: [tools]
    working_dir: /src/dca-ecommerce-sample-dotnet
    volumes:
      - ..:/src
      - nuget-cache:/root/.nuget/packages
    environment:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    entrypoint: ["dotnet"]
    command: ["build"]

  test:
    extends: dotnet
    command: ["test"]

volumes:
  nuget-cache:
