# docker compose up --build          → shop on http://localhost:5080
# docker compose run --rm test       → unit, integration and architecture tests (Debug build, as the rules require)
# docker compose --profile tools run --rm e2e  → the browser suite against the shop service; the image brings the browsers
# docker compose run --rm dotnet <args>  → any other dotnet command with a cached package store
#
# The DomainCentric.* packages come from NuGet.org. The tools service mounts the parent directory so
# `docker compose run --rm dotnet test -p:UseLocalDcaDotnet=true` can reference the sibling ../dca-dotnet.
# podman-compose does not activate a service's profile on `run`: `podman-compose --profile tools run --rm test`.
services:
  shop-dotnet:
    build: .
    image: dca-shop-dotnet
    ports:
      - "5080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # The sample runs embeddable out of the box: another page may frame it, and on another port of
      # the same host its Lax cookies travel into the frame unchanged. Nothing to set for a demo.
      # A real deployment hardens both: Jwt__AllowFraming=false Jwt__SecureCookies=true.
      # A page on another *site* (a different domain) additionally needs Jwt__SameSite=None, which
      # requires Secure cookies and therefore HTTPS.
      Jwt__AllowFraming: ${Jwt__AllowFraming:-true}
      Jwt__SameSite: ${Jwt__SameSite:-Lax}
      Jwt__SecureCookies: ${Jwt__SecureCookies:-false}

  # The payment provider as a stub, for a shop started on this machine (`./gradlew bootRun`, `dotnet run`):
  # WireMock on localhost:8089 with one set of answers per behaviour — PAYMENT_STUB=authorize|refuse|slow
  # (stubs/payment-provider/README.md). `docker compose --profile provider-stub up payment-provider`.
  payment-provider:
    image: wiremock/wiremock:3.13.2
    profiles: [provider-stub]
    ports:
      - "8089:8080"
    command: ["--global-response-templating"]
    volumes:
      - ./stubs/payment-provider/${PAYMENT_STUB:-authorize}:/home/wiremock:ro

  # The E2E suite needs a browser, which the SDK image does not have. This image ships the browser builds of the
  # Playwright release the suite references — keep the tag and DcaShop.E2eTests.csproj on one version.
  # `docker compose --profile tools run --rm e2e` runs it against the shop service over the compose network.
  e2e:
    image: mcr.microsoft.com/playwright/dotnet:v1.62.0-noble
    profiles: [tools]
    working_dir: /src/dca-ecommerce-sample-dotnet
    depends_on: [shop-dotnet]
    # Share the shop's network namespace, so the shop is `localhost:8080` in here too. The embedded-shop tests put
    # their own page on another port of that same host, which is what makes the frame same-site.
    network_mode: "service:shop-dotnet"
    environment:
      E2E_BASE_URL: http://localhost:8080
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    volumes:
      - ..:/src
      - nuget-cache:/root/.nuget/packages
    entrypoint: ["dotnet", "test", "tests/DcaShop.E2eTests"]

  dotnet:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    profiles: [tools]
    working_dir: /src/dca-ecommerce-sample-dotnet
    volumes:
      - ..:/src
      - nuget-cache:/root/.nuget/packages
    environment:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    entrypoint: ["dotnet"]
    command: ["build"]

  # Spelled out rather than `extends: dotnet` — podman-compose 1.6 cannot resolve extends.
  test:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    profiles: [tools]
    working_dir: /src/dca-ecommerce-sample-dotnet
    volumes:
      - ..:/src
      - nuget-cache:/root/.nuget/packages
    environment:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    entrypoint: ["dotnet"]
    command: ["test"]

volumes:
  nuget-cache:
