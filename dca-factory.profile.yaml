contract: 25
# Stack profile — the only place in the pipeline that knows how this project builds and tests.
# The gate and the pre-commit hook read it; a command that is not declared is skipped and named.
# Architecture tests need a Debug build: ArchUnitNET drops Release async state machines.

compile: dotnet build
# `dotnet test` takes one project per invocation — two paths in one call is an MSBuild error
# (MSB1008). Each level names its own project, so the gate can select a single test in it and no
# suite runs twice: `test` is the unit project only, not the whole solution.
test: dotnet test tests/DcaShop.UnitTests --logger trx
test.integration: dotnet test tests/DcaShop.IntegrationTests --logger trx
http.stub: wiremock-net
e2eTest: dotnet test tests/DcaShop.E2eTests/DcaShop.E2eTests.csproj --logger trx
browser: playwright
# The gate reads which tests actually ran from the runner's report; the .NET test
# platform writes one only when asked (`--logger trx`), so it is asked above.
filterFlag: --filter
filterFormat: "FullyQualifiedName~{class}.{method}"
# `dotnet test` reads only its last --filter: several selectors go into one, joined by "|".
filterJoin: "|"
architecture: dotnet test tests/DcaShop.ArchitectureTests

# The one source a stage may treat as an authority. Generated from the same sources as the
# building blocks and the rule catalog this project consumes.
knowledge: dca-knowledge
knowledge.read: guide/language-mappings/building-blocks.md

carrier.build: dca-modelling
carrier.guard: dca-discipline
carrier.glossary: ubiquitous-language
carrier.domain: context-map
carrier.test: e2e-testing
review.ddd: review-ddd
review.hexagonal: review-hexagonal
review.clean-code: review-clean-code

contextMap: docs/architecture/context-map.md
# What must hold for any change (story-gate.py --change, the commit hook, CI). The end-user suite
# starts the shop itself on a free port, so it runs whole here too.
required: compile test test.integration architecture format e2eTest
format: dotnet format --verify-no-changes
formatFix: dotnet format
acceptance: pages
run: dotnet run --project src/DcaShop.Web
carrier.plan: dca-modelling
carrier.discover: product-discovery
covers.test: **
