    <rect x="130" y="105" width="120" height="180" rx="8" fill="#7c3aed" transform="rotate(-5 190 195)"/>
    <rect x="150" y="102" width="120" height="180" rx="8" fill="#8b5cf6" transform="rotate(6 210 192)"/>
  </g>
