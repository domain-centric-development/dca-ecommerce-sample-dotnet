<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fef9c3"/>
      <stop offset="100%" style="stop-color:#fef08a"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)" rx="8"/>
  <!-- Domain event -->
  <rect x="70" y="120" width="110" height="90" rx="3" fill="#fb923c" transform="rotate(-4 125 165)"/>
  <!-- Aggregate -->
  <rect x="150" y="95" width="110" height="90" rx="3" fill="#fde047" transform="rotate(3 205 140)"/>
  <!-- Command -->
  <rect x="225" y="135" width="110" height="90" rx="3" fill="#60a5fa" transform="rotate(-2 280 180)"/>
  <!-- Policy -->
  <rect x="105" y="205" width="110" height="90" rx="3" fill="#c084fc" transform="rotate(2 160 250)"/>
  <!-- External system -->
  <rect x="190" y="225" width="110" height="90" rx="3" fill="#f9a8d4" transform="rotate(-3 245 270)"/>
  <!-- Handwriting hints -->
  <g stroke="#78350f" stroke-width="2" opacity="0.35" stroke-linecap="round">
    <line x1="90" y1="150" x2="155" y2="146"/>
    <line x1="90" y1="168" x2="140" y2="165"/>
    <line x1="170" y1="128" x2="235" y2="132"/>
    <line x1="245" y1="170" x2="310" y2="167"/>
    <line x1="125" y1="240" x2="190" y2="243"/>
    <line x1="210" y1="262" x2="275" y2="259"/>
  </g>
  <!-- Category label -->
  <text x="200" y="350" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#64748b" font-weight="500">Modeling</text>
</svg>
