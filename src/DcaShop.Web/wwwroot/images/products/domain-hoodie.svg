<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e2e8f0"/>
      <stop offset="100%" style="stop-color:#cbd5e1"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)" rx="8"/>

  <!-- Hood, sitting on the shoulders -->
  <path d="M160 172 Q200 112 240 172 Z" fill="#0f172a"/>
  <!-- Body with sleeves -->
  <path d="M158 162 L110 186 L76 180 L94 230 L130 214 L130 316 L270 316 L270 214 L306 230 L324 180 L290 186 L242 162 Z" fill="#1e293b"/>
  <!-- Neck opening, inside the hood -->
  <path d="M176 166 Q200 194 224 166 Z" fill="#020617"/>
  <!-- Drawstrings -->
  <g stroke="#e2e8f0" stroke-width="3.5" stroke-linecap="round">
    <line x1="184" y1="180" x2="180" y2="224"/>
    <line x1="216" y1="180" x2="220" y2="224"/>
  </g>
  <!-- Kangaroo pocket -->
  <path d="M150 258 L250 258 L250 296 L150 296 Z" fill="none" stroke="#475569" stroke-width="2"/>
  <!-- Print: the domain sits inside, the ports point at it -->
  <circle cx="200" cy="230" r="24" fill="none" stroke="#38bdf8" stroke-width="2.5" opacity="0.75"/>
  <circle cx="200" cy="230" r="11" fill="#38bdf8"/>
  <g stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" opacity="0.75">
    <line x1="160" y1="230" x2="172" y2="230"/>
    <line x1="228" y1="230" x2="240" y2="230"/>
  </g>
  <!-- Category label -->
  <text x="200" y="352" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#64748b" font-weight="500">Apparel</text>
</svg>
