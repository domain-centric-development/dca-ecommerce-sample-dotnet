# The rule selection of the shop's architecture suite. ArchitectureRulesTest reads it from the test assembly's
# directory; the project file copies it there.

# The shop runs the experimental rules as well: it is where they are proven before they are released.
dca.rules.experimental = true

# Domain types still hold bare strings, numbers, booleans, time types and ids where the rule wants a value
# (about 60 types in 8 contexts). Off until they are values - TODO #181; the shop stabilises before it grows.
dca.rules.off = DCA-TAC-025
dca.rule.DCA-TAC-025.reason = domain types still hold bare primitives; turning them into values is TODO #181
